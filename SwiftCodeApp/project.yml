name: SwiftCodeApp
options:
  bundleIdPrefix: dev.swiftcode
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      SWIFT_COMPILATION_MODE: singlefile
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEBUG_INFORMATION_FORMAT: dwarf
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ONLY_ACTIVE_ARCH: NO
      ENABLE_TESTABILITY: NO
packages:
  SwiftCode:
    path: ..
targets:
  SwiftCodeApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/Tests/**"
      - path: Resources
    dependencies:
      - package: SwiftCode
        product: SwiftCodeCore
      - package: SwiftCode
        product: SwiftCodeDaemon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftcode.app
        INFOPLIST_KEY_CFBundleDisplayName: SwiftCode
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
  SwiftCodeAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Features/Sessions/Tests
      - path: Sources/Features/Workspace/Tests
      - path: Sources/Features/DiffInspector/Tests
    dependencies:
      - target: SwiftCodeApp
      - package: SwiftCode
        product: SwiftCodeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwiftCodeApp.app/Contents/MacOS/SwiftCodeApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SwiftCodeApp:
    build:
      targets:
        SwiftCodeApp: all
        SwiftCodeAppTests: [test]
    test:
      targets:
        - name: SwiftCodeAppTests
          parallelizable: true
